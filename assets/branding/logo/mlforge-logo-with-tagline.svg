<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120">
  <defs>
    <linearGradient id="gradPillarLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcb97" />
      <stop offset="100%" stop-color="#e78a53" />
    </linearGradient>
    <linearGradient id="gradCrucible" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5f8787" />
      <stop offset="100%" stop-color="#527575" />
    </linearGradient>
    <linearGradient id="gradPillarRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e78a53" />
      <stop offset="100%" stop-color="#d87943" />
    </linearGradient>
    <linearGradient id="gradWordForge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e78a53" />
      <stop offset="100%" stop-color="#fbcb97" />
    </linearGradient>
  </defs>
  <g transform="translate(10, 10)">
    
    <!-- Left Top Lid -->
    <path d="M 14,32 L 32,20 L 44,28 L 26,40 Z" fill="#fbcb97" />
    <!-- Left Vertical Face -->
    <path d="M 14,32 L 26,40 L 26,76 L 14,68 Z" fill="url(#gradPillarLeft)"  />
    <!-- Center Descending Ribbon Fold -->
    <path d="M 26,40 L 44,28 L 62,44 L 44,56 Z" fill="url(#gradCrucible)"  />
    <!-- Center Ascending Ribbon Fold -->
    <path d="M 26,76 L 44,88 L 60,74 L 42,62 Z" fill="#527575" />
    <!-- Right Arch & Pillar -->
    <path d="M 62,44 L 78,32 L 78,74 L 66,74 L 66,54 L 44,56 Z" fill="url(#gradPillarRight)"  />
    <!-- Bottom Cap -->
    <path d="M 14,68 L 26,76 L 36,84 L 24,76 Z" fill="#9e4e24" />
    <!-- Floating Data Pixels -->
    <rect x="56" y="8" width="6.5" height="6.5" rx="1.2" fill="#fbcb97" />
    <rect x="66" y="8" width="6.5" height="6.5" rx="1.2" fill="#e78a53" />
    <rect x="50" y="18" width="6.5" height="6.5" rx="1.2" fill="#5f8787" />
    <rect x="60" y="18" width="6.5" height="6.5" rx="1.2" fill="#d87943" />
    <rect x="70" y="18" width="6.5" height="6.5" rx="1.2" fill="#fbcb97" />
    
  </g>
  <text x="128" y="62" font-family="'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="42" fill="#f3f4f6" letter-spacing="-0.03em">ML<tspan fill="url(#gradWordForge)">Forge</tspan></text>
  <text x="130" y="86" font-family="'Geist Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="11.5" fill="#888888" letter-spacing="0.14em">MACHINE LEARNING DEVELOPMENT PLATFORM</text>
</svg>